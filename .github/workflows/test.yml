name: test

on:
- push
- pull_request

jobs:
  phpunit:
    name: phpunit
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    strategy:
      matrix:
        include:
        - php-version: "8.2"
          dependencies: lowest
        - php-version: "8.5"
          dependencies: highest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        coverage: xdebug
        php-version: "${{ matrix.php-version }}"
        ini-values: memory_limit=-1, apc.enable_cli=On
        tools: composer:v2
        extensions: redis, apcu
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.composer/cache
          vendor
        key: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}"
        restore-keys: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}-"

    - name: Install dependencies
      run: composer update --no-interaction --no-progress --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

    - name: Run PHPUnit
      run: make test-coveralls
      env:
        ICANBOOGIE_REDIS_HOST: localhost
        ICANBOOGIE_REDIS_PORT: 6379

    - name: Upload code coverage
      if: ${{ matrix.dependencies == 'highest' }}
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        composer global require php-coveralls/php-coveralls
        php-coveralls --coverage_clover=build/logs/clover.xml -v
