---
services:
  app82:
    build:
      context: .
      args:
        PHP_VERSION: "8.2"
    depends_on: &dep
      - redis
    environment: &env
      PHP_IDE_CONFIG: 'serverName=icanboogie-storage'
      ICANBOOGIE_REDIS_HOST: redis
      ICANBOOGIE_REDIS_PORT: 6379
    volumes: &vol
      - .:/app:delegated
      - composer-cache:/opt/composer/cache
    working_dir: /app

  app85:
    build:
      context: .
      args:
        PHP_VERSION: "8.5"
    depends_on: *dep
    environment: *env
    volumes: *vol
    working_dir: /app

  redis:
    image: redis:5.0-alpine

volumes:
  composer-cache: ~
